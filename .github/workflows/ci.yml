name: tests-and-package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  locked:
    name: locked-${{ matrix.os }}-py${{ matrix.python }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "uv>=0.6,<1"
      - run: uv sync --locked --extra dev
      - run: uv run --locked ruff check usimmics_bridge tests scripts
      - run: uv run --locked pytest -m "not integration" --basetemp .testtmp-ci -q
      - run: uv build
      - run: uv export --locked --no-dev --no-emit-project --no-hashes --output-file .ci-runtime-requirements.txt
      - name: Install wheel into a clean venv and exercise it outside the checkout
        run: python scripts/smoke_wheel.py --wheel dist --requirements .ci-runtime-requirements.txt
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}-${{ matrix.python }}
          path: dist/*
  compatible-latest:
    name: latest-compatible-dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade ".[dev]"
      - run: python -m ruff check usimmics_bridge tests scripts
      - run: python -m pytest -m "not integration" --basetemp .testtmp-compatible -q
      - run: python -m build
      - name: Verify wheel with the latest dependencies permitted by its metadata
        run: python scripts/smoke_wheel.py --wheel dist
